name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: false
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go test -run xxx -fuzz FuzzParse -fuzztime 60s ./internal/parser
      - run: go test -run xxx -fuzz FuzzFrontMatter -fuzztime 60s ./internal/parser
      - run: go test -run xxx -fuzz FuzzNormalizeRel -fuzztime 30s ./internal/workspace
      - run: go test -run xxx -fuzz FuzzClassify -fuzztime 30s ./internal/discovery

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: make cross

  # Publishes a rolling "latest" release from every push to master, once test,
  # fuzz and cross-compile have all passed. It is not a versioned release: it
  # always reflects the tip of master, is marked as a pre-release so it never
  # steals GitHub's "Latest" badge from an actual version tag, and its assets
  # are replaced wholesale on the next push rather than accumulating.
  release-latest:
    name: publish latest build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, fuzz, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build release binaries
        run: make cross VERSION="0.0.0-dev+${GITHUB_SHA::7}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (master @ ${{ github.sha }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automatic build from the tip of `master`. Not a versioned release —
            replaced on every push. For a stable version, use a tagged release
            once one exists.

            Commit: ${{ github.sha }}
          files: dist/*
